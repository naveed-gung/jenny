<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="95" fill="url(#gradient1)" stroke="#667eea" stroke-width="3"/>
  
  <!-- Gradient Definition -->
  <defs>
    <linearGradient id="gradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradient2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f093fb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5576c;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Robot/Avatar Head -->
  <g transform="translate(100, 90)">
    <!-- Main head -->
    <rect x="-30" y="-35" width="60" height="55" rx="8" fill="white" opacity="0.95"/>
    
    <!-- Antenna -->
    <line x1="0" y1="-35" x2="0" y2="-45" stroke="white" stroke-width="3" stroke-linecap="round"/>
    <circle cx="0" cy="-48" r="4" fill="url(#gradient2)"/>
    
    <!-- Eyes -->
    <circle cx="-15" cy="-15" r="6" fill="#667eea"/>
    <circle cx="15" cy="-15" r="6" fill="#667eea"/>
    
    <!-- Eye highlights -->
    <circle cx="-13" cy="-17" r="2" fill="white"/>
    <circle cx="17" cy="-17" r="2" fill="white"/>
    
    <!-- Smile -->
    <path d="M -15 5 Q 0 12 15 5" stroke="#667eea" stroke-width="3" fill="none" stroke-linecap="round"/>
    
    <!-- Ears/Side panels -->
    <rect x="-38" y="-15" width="6" height="20" rx="3" fill="white" opacity="0.9"/>
    <rect x="32" y="-15" width="6" height="20" rx="3" fill="white" opacity="0.9"/>
  </g>
  
  <!-- Chat Bubble -->
  <g transform="translate(145, 140)">
    <path d="M 0 0 L 30 0 Q 35 0 35 5 L 35 20 Q 35 25 30 25 L 10 25 L 5 30 L 5 25 L 5 25 Q 0 25 0 20 L 0 5 Q 0 0 5 0 Z" 
          fill="white" opacity="0.95" stroke="#667eea" stroke-width="2"/>
    <circle cx="10" cy="12.5" r="2" fill="#667eea"/>
    <circle cx="17.5" cy="12.5" r="2" fill="#667eea"/>
    <circle cx="25" cy="12.5" r="2" fill="#667eea"/>
  </g>
  
  <!-- Name "JENNY" -->
  <text x="100" y="175" font-family="Arial, sans-serif" font-size="24" font-weight="bold" 
        fill="white" text-anchor="middle">JENNY</text>
  <text x="100" y="190" font-family="Arial, sans-serif" font-size="10" 
        fill="white" text-anchor="middle" opacity="0.9">AI AVATAR CHAT</text>
</svg>
